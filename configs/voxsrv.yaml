# VoxTun 服务端配置
bindAddr: "0.0.0.0"          # 控制连接监听地址
bindPort: 7000               # 控制连接监听端口（客户端连接此端口）
publicAddr: ""               # 公网 IP 或域名，用于 SIP SDP 重写；留空则使用 bindAddr
token: "voxTun_secret"       # 客户端认证 token，留空则不校验
logLevel: "info"             # 日志级别: debug / info / warn / error
maxPoolCount: 5              # 预留连接池大小
udpPacketSize: 1500          # UDP 包缓冲大小

# sip-tls 代理使用的 TLS 证书与私钥（PEM），两者需同时配置；
# 服务端在 sip-tls 代理的 remotePort 上原生终止 TLS，未配置时 sip-tls 代理无法注册
tlsCertFile: ""              # 例如 /etc/voxtun/server.crt
tlsKeyFile: ""               # 例如 /etc/voxtun/server.key

# 允许客户端代理的端口范围（不配置则不限制）
allowPorts:
  - start: 5060
    end: 5061
  - start: 4569
    end: 4569
  - start: 10000
    end: 20000

# IP 黑白名单过滤（对控制连接、TCP/UDP 代理、RTP 中继的所有外部对端生效）
# 被拒绝的来源以 INFO 级别记录（同一 IP 5 分钟内只记一次），便于发现对端 IP 漂移
ipFilter:
  enable: false          # 是否启用，默认关闭
  # 白名单：非空时仅放行这些 IP/CIDR，需同时包含客户端（voxcli）与外部话机的 IP
  allowList: []
  #   - "192.168.1.100"
  #   - "203.0.113.10"
  #   - "10.0.0.0/8"
  # 黑名单：优先级高于白名单
  denyList: []
  #   - "1.2.3.4"

# 管理面板（Web 控制台）
# port 为 0 时不启动；一旦配置端口，user/password 必须同时设置。
# 面板不受 ipFilter 约束（避免管理员被锁在门外），请用云安全组/防火墙限制来源 IP，
# 或把 addr 设为 127.0.0.1 后通过 SSH 隧道访问（ssh -L 7500:127.0.0.1:7500 <server>）
webServer:
  addr: "0.0.0.0"
  port: 0                # 例如 7500
  user: "admin"
  password: ""           # 请改为强密码，留空且 port 非 0 时服务端会报错并跳过面板

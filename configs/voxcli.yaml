# VoxTun 客户端配置
serverAddr: "127.0.0.1"      # 服务端地址
serverPort: 7000             # 服务端控制端口
token: "voxTun_secret"       # 认证 token，需与服务端一致
logLevel: "info"             # 日志级别

# 代理列表
proxies:
  # SIP 信令（UDP 5060），支持 SDP 重写
  - name: "sip-udp"
    type: "sip"              # sip 类型，内部使用 UDP 中继
    localIP: "127.0.0.1"     # 内网 SIP 服务地址
    localPort: 5060          # 内网 SIP 服务端口
    remotePort: 5060         # 公网暴露端口
    rewriteSDP: true         # 是否重写 SDP（将内网地址替换为公网地址）

  # IAX 信令（UDP 4569）
  - name: "iax-udp"
    type: "iax"              # iax 类型，内部使用 UDP 中继
    localIP: "127.0.0.1"
    localPort: 4569
    remotePort: 4569
    rewriteSDP: false

  # SIP over TLS（服务端原生终止 TLS）
  # 该监听器同时接受 TLS 与明文 SIP/TCP：按连接首字节嗅探（TLS ClientHello 为 0x16）自动分流，
  # 因此可与明文 SIP/TCP 话机共用同一 remotePort（如 5060），无需再为同一端口配置 sip-tcp。
  # 无论 TLS 还是明文连接，都由服务端按 SIP 分帧并做 SDP 改写 / RTP 中继。
  - name: "sip-tls"
    type: "sip-tls"
    localIP: "127.0.0.1"     # 内网 SIP 服务地址（需支持 TCP 传输）
    localPort: 5060
    remotePort: 5060         # 与明文 SIP/TCP 共用同一公网端口
    rewriteSDP: true

  # SIP over TCP（明文，不做 TLS）——仅当不需要 TLS、只想在 TCP 上传 SIP 时使用。
  # 与上面的 sip-tls 二选一（同一 remotePort 不能重复绑定）：
  #   - name: "sip-tcp"
  #     type: "sip-tcp"
  #     localIP: "127.0.0.1"
  #     localPort: 5060
  #     remotePort: 5060
  #     rewriteSDP: true     # 必须开启，否则 SDP 不改写、通话媒体不可达
